apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: spiritual-gifts
  labels:
    app: spiritual-gifts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spiritual-gifts
  template:
    metadata:
      labels:
        app: spiritual-gifts
    spec:
      containers:
        - name: web
          image: registry.registry.svc:5000/spiritual-gifts:latest
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20